kind = "web"
previewPath = "/"
title = "Sama Senegal"
version = "1.0.0"
id = "artifacts/sama-senegal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25141

[services.development]
run = "pnpm --filter @workspace/sama-senegal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sama-senegal", "run", "build" ]
publicDir = "artifacts/sama-senegal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25141"
BASE_PATH = "/"
